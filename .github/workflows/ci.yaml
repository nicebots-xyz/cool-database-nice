name: CI

# Builds every variant, checks it against its pins and runs the Swarm smoke test on it.
# arm64 is built under QEMU to catch platform breakage, but only amd64 is smoke-tested.

# Pushes to main are covered by the Release workflow, which tests the candidate images it builds.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The SBOM scanner BuildKit uses for release attestations is syft too.
  # renovate: datasource=docker
  SYFT_IMAGE: anchore/syft:v1.51.0@sha256:678bfa565b60f747aac0f8e964fe5588a24445b8d0a480e91f6efd70020dfbb0

jobs:
  test:
    name: build-test (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: base
            image: hippo-dev/hippo:18
          - variant: ext
            image: hippo-dev/hippo:18-ext
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        run: docker buildx bake --load ${{ matrix.variant }}

      - name: Pins = contents
        run: python3 tests/pins/check.py ${{ matrix.variant }} ${{ matrix.image }}

      - name: SBOM = contents
        run: |
          docker save "${{ matrix.image }}" -o "$RUNNER_TEMP/image.tar"
          docker run --rm -v "$RUNNER_TEMP:/scan:ro" "$SYFT_IMAGE" docker-archive:/scan/image.tar \
            -o spdx-json -q --select-catalogers +sbom-cataloger > "$RUNNER_TEMP/sbom.json"
          python3 tests/sbom/check.py "${{ matrix.image }}" "$RUNNER_TEMP/sbom.json"

      - name: Smoke test
        run: tests/smoke/run.sh ${{ matrix.image }}

  arm64:
    name: build (arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        run: docker buildx bake --set '*.platform=linux/arm64' --set '*.output=type=cacheonly'
