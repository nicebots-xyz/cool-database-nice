networks:
  pgnet:
    external: true
    name: t1_pgnet
secrets:
  pg_superuser_password:
    file: ./su.secret
  pg_replication_password:
    file: ./repl.secret
configs:
  patroni_v3:
    file: ./patroni.yml.tmpl
    template_driver: golang
  pg_haproxy_v1:
    file: ./haproxy.cfg
volumes:
  pgdata:
    name: "pgdata-{{.Task.Slot}}"
services:
  pg:
    image: hippo-lab/patroni:18
    hostname: "pg-{{.Task.Slot}}"
    networks: [pgnet]
    environment:
      PATRONI_NAME: "pg-{{.Task.Slot}}"
      PATRONI_RESTAPI_CONNECT_ADDRESS: "pg-{{.Task.Slot}}:8008"
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: "pg-{{.Task.Slot}}:5432"
    secrets: [pg_superuser_password, pg_replication_password]
    configs:
      - source: patroni_v3
        target: /etc/patroni.yml
        uid: "999"
        gid: "999"
        mode: 0400
    volumes:
      - type: volume
        source: pgdata
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 60s
    stop_grace_period: 120s
    deploy:
      replicas: 3
      endpoint_mode: dnsrr
      placement:
        constraints: [node.labels.hippo.pg == true]
        max_replicas_per_node: 1
      update_config: {parallelism: 1, order: stop-first, delay: 10s, failure_action: pause}
  pg-haproxy:
    image: haproxy:3.2-alpine
    networks: [pgnet]
    configs: [{source: pg_haproxy_v1, target: /usr/local/etc/haproxy/haproxy.cfg}]
