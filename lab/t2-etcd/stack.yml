networks:
  pgnet:
    external: true
    name: t1_pgnet
services:
  etcd:
    image: quay.io/coreos/etcd:v3.6.5
    hostname: "etcd-{{.Task.Slot}}"
    networks: [pgnet]
    environment:
      ETCD_NAME: "etcd-{{.Task.Slot}}"
      ETCD_DATA_DIR: /data
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: "http://etcd-{{.Task.Slot}}:2379"
      ETCD_INITIAL_ADVERTISE_PEER_URLS: "http://etcd-{{.Task.Slot}}:2380"
      ETCD_INITIAL_CLUSTER: etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: hippo-lab
    volumes:
      - type: volume
        source: etcd-data
        target: /data
    deploy:
      replicas: 3
      endpoint_mode: dnsrr
      placement:
        constraints: [node.labels.hippo.pg == true]
        max_replicas_per_node: 1
      update_config: {parallelism: 1, order: stop-first, delay: 5s}
volumes:
  etcd-data:
    name: "etcd-data-{{.Task.Slot}}"
