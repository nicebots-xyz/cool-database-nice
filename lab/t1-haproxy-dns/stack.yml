networks:
  pgnet:
    driver: overlay
    ipam:
      config: [{subnet: 10.77.0.0/24}]
configs:
  haproxy_v1:
    file: ./haproxy.cfg
services:
  web:
    image: traefik/whoami:latest
    hostname: "web-{{.Node.Hostname}}"
    networks: [pgnet]
    deploy:
      replicas: 3
      endpoint_mode: dnsrr
      placement: {max_replicas_per_node: 1}
  webvip:
    image: traefik/whoami:latest
    networks: [pgnet]
    deploy: {replicas: 3}
  haproxy:
    image: haproxy:3.2-alpine
    networks: [pgnet]
    configs: [{source: haproxy_v1, target: /usr/local/etc/haproxy/haproxy.cfg}]
  probe:
    image: alpine:3.22
    command: sleep infinity
    networks: [pgnet]
