global
  log stdout format raw local0 info
defaults
  log global
  mode http
  timeout connect 2s
  timeout client 10s
  timeout server 10s
resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 5s
frontend stats
  bind :8404
  stats enable
  stats uri /stats
frontend fe_dnsrr
  bind :8001
  default_backend be_dnsrr
frontend fe_tasks
  bind :8002
  default_backend be_tasks
backend be_dnsrr
  default-server inter 2s fall 2 rise 1
  server-template w 5 web:80 check resolvers docker init-addr none resolve-prefer ipv4
backend be_tasks
  default-server inter 2s fall 2 rise 1
  server-template t 5 tasks.webvip:80 check resolvers docker init-addr none resolve-prefer ipv4
