# Routes :5000 to the Patroni leader and :5001 to the replicas, following Patroni's REST API.
# Members are discovered through Docker's DNS, so IP changes are picked up automatically.
global
  log stdout format raw local0 info
defaults
  log global
  mode tcp
  timeout connect 2s
  timeout client 30m
  timeout server 30m
resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 5s
frontend stats
  mode http
  bind :8404
  stats enable
  stats uri /stats
listen primary
  bind :5000
  option httpchk GET /primary
  http-check expect status 200
  default-server inter 500ms fall 1 rise 1 on-marked-down shutdown-sessions
  server-template pg 3 pg:5432 check port 8008 resolvers docker init-addr none resolve-prefer ipv4
listen replicas
  bind :5001
  balance roundrobin
  option httpchk GET /replica
  http-check expect status 200
  default-server inter 500ms fall 1 rise 1 on-marked-down shutdown-sessions
  server-template pg 3 pg:5432 check port 8008 resolvers docker init-addr none resolve-prefer ipv4
